    <style type="text/css">
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;

            overflow: hidden;
            background-color: #0b0f19;
        }

        #mynetwork {
            width: 100%;
            height: 100vh;

<body>
    <div class="card" style="width: 100%">


        <div id="mynetwork" class="card-body"></div>
    </div>




    <script type="text/javascript">

        // initialize global variables.
        var edges;
        var nodes;
        var allNodes;
        var allEdges;
        var nodeColors;
        var originalNodes;
        var network;
        var container;
        var options, data;
        var filter = {
            item: '',
            property: '',
            value: []
        };





        // This method is responsible for drawing the graph, returns the drawn network
        function drawGraph() {
            var container = document.getElementById('mynetwork');



            // parsing and collecting nodes and edges from the python
            nodes = new vis.DataSet([{ "color": "#ef4444", "font": { "color": "white" }, "id": "Unknown Patient", "label": "Unknown Patient", "shape": "diamond", "size": 40, "title": "\u003cdiv style=\"font-family: Arial; padding: 10px; background: #1e293b; border-radius: 8px; border: 1px solid #334155;\"\u003e\u003ch3 style=\"margin:0 0 5px 0; color: #38bdf8;\"\u003eUnknown Patient\u003c/h3\u003e\u003cb\u003eAge:\u003c/b\u003e None \u003cbr\u003e\u003cb\u003eGender:\u003c/b\u003e None \u003cbr\u003e\u003cb\u003eID:\u003c/b\u003e 9791957112\u003c/div\u003e" }, { "color": "#eab308", "font": { "color": "white" }, "id": "DATE_2026-02-20", "label": "2026-02-20", "shape": "hexagon", "size": 25, "title": "\u003cdiv style=\u0027padding:5px;\u0027\u003e\u003cb\u003eVisit Date:\u003c/b\u003e 2026-02-20\u003cbr\u003e\u003cb\u003eFacility:\u003c/b\u003e None\u003c/div\u003e" }]);
            edges = new vis.DataSet([{ "color": "#475569", "from": "Unknown Patient", "to": "DATE_2026-02-20", "width": 2 }]);

            nodeColors = {};
            allNodes = nodes.get({ returnType: "Object" });
            for (nodeId in allNodes) {
                nodeColors[nodeId] = allNodes[nodeId].color;
            }
            allEdges = edges.get({ returnType: "Object" });
            // adding nodes and edges to the graph
            data = { nodes: nodes, edges: edges };

            var options = { "interaction": { "hover": true, "zoomView": true }, "physics": { "forceAtlas2Based": { "gravitationalConstant": -150, "centralGravity": 0.02, "springLength": 100 } } };






            network = new vis.Network(container, data, options);










            return network;

        }
        drawGraph();
    </script>

    <script type="text/javascript">
        network.on("hoverNode", function (params) {
            var hover_id = params.node;
            var connected_nodes = network.getConnectedNodes(hover_id);
            connected_nodes.push(hover_id);
            var all_nodes = nodes.get();
            var node_updates = [];
            for (var i = 0; i < all_nodes.length; i++) {
                var node = all_nodes[i];
                if (node.original_color === undefined) { node.original_color = node.color; }
                if (connected_nodes.includes(node.id)) {
                    node_updates.push({ id: node.id, color: node.original_color, font: { color: 'white' } });
                } else {
                    node_updates.push({ id: node.id, color: 'rgba(50,50,50,0.2)', font: { color: 'rgba(255,255,255,0.05)' } });
                }
            }
            nodes.update(node_updates);
            var connected_edges = network.getConnectedEdges(hover_id);
            var all_edges = edges.get();
            var edge_updates = [];
            for (var i = 0; i < all_edges.length; i++) {
                var edge = all_edges[i];
                if (edge.original_color === undefined) { edge.original_color = edge.color || '#475569'; }
                if (connected_edges.includes(edge.id)) {
                    edge_updates.push({ id: edge.id, color: '#94a3b8', width: 3 });
                } else {
                    edge_updates.push({ id: edge.id, color: 'rgba(50,50,50,0.1)', width: 1 });
                }
            }
            edges.update(edge_updates);
        });
        network.on("blurNode", function (params) {
            var all_nodes = nodes.get();
            var node_updates = [];
            for (var i = 0; i < all_nodes.length; i++) {
                if (all_nodes[i].original_color !== undefined) {
                    node_updates.push({ id: all_nodes[i].id, color: all_nodes[i].original_color, font: { color: 'white' } });
                }
            }
            nodes.update(node_updates);
            var all_edges = edges.get();
            var edge_updates = [];
            for (var i = 0; i < all_edges.length; i++) {
                if (all_edges[i].original_color !== undefined) {
                    edge_updates.push({ id: all_edges[i].id, color: all_edges[i].original_color, width: (all_edges[i].dashes ? 1 : 2) });
                }
            }
            edges.update(edge_updates);
        });
    </script>
