<script type="text/javascript">
    // Triggers when you hover over a node
    network.on("hoverNode", function (params) {
        var hover_id = params.node;
        var connected_nodes = network.getConnectedNodes(hover_id);
        connected_nodes.push(hover_id); // Include the hovered node itself

        // 1. Dim non-connected nodes
        var all_nodes = nodes.get();
        var node_updates = [];
        for (var i = 0; i < all_nodes.length; i++) {
            var node = all_nodes[i];
            if (node.original_color === undefined) { node.original_color = node.color; } // Save original color

            if (connected_nodes.includes(node.id)) {
                node_updates.push({id: node.id, color: node.original_color, font: {color: 'white'}});
            } else {
                // Blur effect: drop opacity heavily
                node_updates.push({id: node.id, color: 'rgba(80,80,80,0.15)', font: {color: 'rgba(255,255,255,0.1)'}});
            }
        }
        nodes.update(node_updates);

        // 2. Dim non-connected edges
        var connected_edges = network.getConnectedEdges(hover_id);
        var all_edges = edges.get();
        var edge_updates = [];
        for (var i = 0; i < all_edges.length; i++) {
            var edge = all_edges[i];
            if (edge.original_color === undefined) { edge.original_color = edge.color || '#555555'; }

            if (connected_edges.includes(edge.id)) {
                edge_updates.push({id: edge.id, color: '#ffffff'}); // Highlight active edges in white
            } else {
                edge_updates.push({id: edge.id, color: 'rgba(80,80,80,0.1)'}); // Blur other edges
            }
        }
        edges.update(edge_updates);
    });

    // Triggers when your mouse leaves the node
    network.on("blurNode", function (params) {
        // Restore all original colors
        var all_nodes = nodes.get();
        var node_updates = [];
        for (var i = 0; i < all_nodes.length; i++) {
            if (all_nodes[i].original_color !== undefined) {
                node_updates.push({id: all_nodes[i].id, color: all_nodes[i].original_color, font: {color: 'white'}});
            }
        }
        nodes.update(node_updates);

        var all_edges = edges.get();
        var edge_updates = [];
        for (var i = 0; i < all_edges.length; i++) {
            if (all_edges[i].original_color !== undefined) {
                edge_updates.push({id: all_edges[i].id, color: all_edges[i].original_color});
            }
        }
        edges.update(edge_updates);
    });
</script>
