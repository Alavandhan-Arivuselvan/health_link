<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HealthLink — Dynamic Health Canvas</title>
  <meta name="description" content="Interactive 3D anatomical body map for HealthLink patient health data visualization">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/visual/healthlink-viewer/style.css">
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loader-content">
      <div class="pulse-ring"></div>
      <div class="pulse-ring delay"></div>
      <svg class="loader-icon" viewBox="0 0 24 24" width="48" height="48">
        <path fill="#7C5CFC" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <h2>HealthLink</h2>
      <p>Loading anatomical model...</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>

  <!-- [RN: This entire structure maps to a React Native <View> tree] -->
  <div id="app">

    <!-- Header [RN: components/Header.jsx] -->
    <header id="header">
      <div class="header-left">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <path fill="#7C5CFC" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="brand">HealthLink</span>
        </div>
        <span class="tagline">Dynamic Health Canvas</span>
      </div>
      <div class="header-right">
        <button id="btn-reset" class="btn-icon" title="Reset View">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button id="btn-auto-rotate" class="btn-icon active" title="Auto Rotate">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        </button>
      </div>
    </header>

    <!-- 3D Canvas — Full Screen [RN: uses expo-three GLView] -->
    <div id="canvas-container">
      <canvas id="three-canvas"></canvas>
      <div id="zone-tooltip" class="hidden"></div>
      <div id="hint">
        <span>🖱️ Click a body region to explore health data</span>
        <span>•</span>
        <span>Scroll to zoom • Drag to rotate</span>
      </div>
    </div>

    <!-- Floating Chat FAB [RN: components/ChatFAB.jsx] -->
    <button id="btn-chat" class="chat-fab" title="Open Chat">
      <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/><path fill="currentColor" d="M7 9h10v2H7zm0-3h10v2H7zm0 6h7v2H7z"/></svg>
      <span class="fab-label">Chat</span>
    </button>

    <!-- Chat Overlay [RN: screens/ChatScreen.jsx] -->
    <div id="chat-overlay" class="overlay-hidden">
      <div class="chat-container">
        <div class="chat-header">
          <div class="chat-header-left">
            <span class="chat-header-icon">💬</span>
            <div>
              <h3>HealthLink Chat</h3>
              <span class="chat-status">Online</span>
            </div>
          </div>
          <button id="btn-chat-close" class="btn-icon" title="Close Chat">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="chat-messages" id="chat-messages">
          <!-- Messages injected by JS -->
        </div>
        <div class="chat-input-bar">
          <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
          <button id="btn-chat-send" class="chat-send-btn" title="Send">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Anatomy Overlay Panel [RN: screens/AnatomyPanel.jsx] -->
    <div id="overlay-panel" class="overlay-hidden">
      <div class="overlay-panel-inner">
        <!-- Close button -->
        <button id="btn-panel-close" class="overlay-close-btn" title="Close">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>

        <!-- Anatomy Directory [RN: components/AnatomyDirectory.jsx] -->
        <div id="anatomy-directory">
          <div class="panel-header">
            <h2>Anatomical Directory</h2>
            <p class="panel-subtitle">Select a specific organ, muscle, or region</p>
          </div>
          <div class="directory-list" id="directory-list"></div>
        </div>

        <!-- Zone Detail [RN: components/ZoneDetail.jsx] -->
        <div id="zone-detail" class="hidden">
          <div class="detail-header">
            <button id="btn-back" class="btn-icon" title="Back to Directory">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="detail-title">
              <span id="detail-icon"></span>
              <div class="title-group">
                <span id="detail-category" class="subtitle"></span>
                <h3 id="detail-name"></h3>
              </div>
            </div>
          </div>

          <div id="entity-loading" class="hidden">
            <div class="skeleton-row"></div>
            <div class="skeleton-row short"></div>
            <div class="skeleton-row"></div>
            <div class="skeleton-row short"></div>
          </div>

          <div id="entity-content" class="hidden">
            <div id="stats-section" class="detail-section">
              <div class="section-label">📊 Key Metrics</div>
              <div class="stat-grid" id="stat-grid"></div>
            </div>
            <div class="detail-section">
              <div class="section-label">🔗 Clinical Data Map</div>
              <div id="entity-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Three.js + OBJLoader from CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/visual/healthlink-viewer/app.js"></script>
</body>
</html>
